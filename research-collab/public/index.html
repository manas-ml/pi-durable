<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Research Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Ccircle cx='15' cy='15' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M20 20l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Join screen -->
<main id="join" class="join" hidden>
	<form id="join-form" class="join-card" autocomplete="off">
		<div class="logo" aria-hidden="true">
			<svg viewBox="0 0 32 32" width="28" height="28"><circle cx="15" cy="15" r="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
		</div>
		<h1>Research Room</h1>
		<p class="muted">One shared research agent. Everyone in the room can steer it.</p>
		<label for="invite-input">Invite link or code</label>
		<input id="invite-input" type="password" spellcheck="false" placeholder="Paste your invite" required>
		<p id="join-error" class="error" role="alert" hidden></p>
		<button class="btn primary block" type="submit">Join the room</button>
	</form>
</main>

<!-- App -->
<div id="app" class="app" hidden>
	<header class="topbar">
		<div class="brand">
			<span class="logo sm" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18"><circle cx="15" cy="15" r="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
			<strong>Research Room</strong>
		</div>
		<div class="top-right">
			<span id="status" class="chip" role="status"><i class="dot"></i><span id="status-text">Connecting</span></span>
			<span id="me" class="me"></span>
			<button id="leave" class="btn ghost sm" type="button">Leave</button>
		</div>
	</header>

	<nav class="tabs" aria-label="Sections">
		<button class="tab active" data-pane="chat" type="button">Chat</button>
		<button class="tab" data-pane="research" type="button">Research <b id="tab-count" class="count" hidden></b></button>
		<button class="tab" data-pane="people" type="button">People</button>
	</nav>

	<div class="layout" data-pane="chat">
		<aside id="pane-people" class="rail left" aria-label="People">
			<section>
				<h2>Online now</h2>
				<ul id="presence" class="people"></ul>
			</section>
			<section id="host-tools" hidden>
				<h2>Invite someone</h2>
				<form id="invite-form" class="invite-form">
					<input id="invite-name" placeholder="Their name" maxlength="40" required aria-label="Name of the person to invite">
					<select id="invite-role" aria-label="Role">
						<option value="editor">Can steer</option>
						<option value="viewer">Watch only</option>
					</select>
					<button class="btn primary" type="submit">Create link</button>
				</form>
				<div id="invite-result" class="invite-result" hidden></div>
				<h2 class="spaced">Invited</h2>
				<ul id="invites" class="people"></ul>
			</section>
		</aside>

		<main class="center" aria-label="Conversation">
			<div id="log" class="log" tabindex="0" aria-live="polite" aria-relevant="additions"></div>
			<button id="jump" class="jump" type="button" hidden>
				<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v9M4 8.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
				Jump to latest
			</button>
			<form id="composer" class="composer">
				<div id="notice" class="notice" role="alert" hidden>
					<span id="notice-text"></span>
					<button id="notice-close" class="icon-btn" type="button" aria-label="Dismiss">✕</button>
				</div>
				<p id="composer-note" class="composer-note" hidden></p>
				<div class="composer-box">
					<textarea id="input" rows="1" placeholder="Ask something, or steer the research…" aria-label="Message" maxlength="4000"></textarea>
					<div class="composer-row">
						<label class="toggle" title="Interrupt the agent's current step instead of queueing your message">
							<input id="steer" type="checkbox"><span class="switch" aria-hidden="true"></span>
							<span>Steer</span>
						</label>
						<span class="spacer"></span>
						<button id="abort" class="btn danger sm" type="button" hidden>Stop</button>
						<button id="send" class="btn primary" type="submit">Send</button>
					</div>
				</div>
			</form>
		</main>

		<aside id="pane-research" class="rail right" aria-label="Research">
			<section>
				<h2>Activity</h2>
				<div id="tasks" class="tasks"></div>
			</section>
			<section>
				<h2>Sources</h2>
				<ul id="sources" class="sources"></ul>
			</section>
		</aside>
	</div>
</div>

<div id="toast" class="toast" role="alert" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
